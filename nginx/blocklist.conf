# IP blocklist, included from the http context in nginx.conf.
#
# These IPs are denied globally (every server, including the ALB health
# check). $remote_addr here is the real client IP: the real_ip module in
# nginx.conf rewrites it from X-Forwarded-For for connections coming through
# the ALB, so deny matches the true source rather than the load balancer.
#
# Denied requests get 403 and never reach uwsgi.

# 2026-07-24 vuln-scan burst (~22:30 UTC): sprayed /, /.env*, /.git/config,
# /.aws/credentials, Laravel _ignition RCE probes, PHP webshell paths.
deny 45.148.10.59;    # RIPE space, led the / surge (659 reqs)
deny 52.242.193.144;  # Azure, PHP webshell scanner

# NOT a scanner: legit arenaclient (Go-http-client on /api/*) + browser user.
# Temporarily denied to shed backend load during the incident, while the
# backend is down and all users are effectively locked out anyway.
# Revisit / remove once the backend is healthy again.
deny 73.16.255.11;    # Comcast residential, heavy /api/ load
