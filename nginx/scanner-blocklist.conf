# Scanner blocklist -- included inside a server block.
#
# WHY THIS EXISTS
# Vulnerability scanners probe this host constantly: ~285k requests over 30 days
# of ALB logs across ~2500 distinct paths that no route serves. Dropping the
# obvious ones here keeps them out of uwsgi, off Django's 404 path, and out of
# the traffic metrics where they otherwise inflate the leftover pile.
#
# THE RULE FOR EDITING THIS FILE
# Every pattern must be *impossible* to match a real URL, not merely unlikely.
# A 444 is a dropped connection with no error page and no clue why, so a false
# positive is a silent, hard-to-diagnose outage of a real page. That trade is
# never worth a few percent more coverage -- when in doubt, let it through and
# let traffic classification account for it downstream.
#
# So there are exactly two kinds of rule here:
#   1. Structural rules, safe by construction -- they describe URL shapes this
#      app cannot generate. Three of them, covering ~76% of probe traffic. Each
#      was checked against all 605 routes declared in urls.py.
#   2. Literal exact-match paths, taken verbatim from observed probes.
#      `location = /foo` matches that one path and nothing else, so these cannot
#      misfire.
#
# Do NOT add a pattern rule for a filename you saw once -- add it to the literal
# list instead. The remaining tail is thousands of paths at a handful of hits
# each, shaped like plausible routes (/ip, /login, /new/, /old/) -- not worth
# the risk of pattern-matching.
#
# WHAT THIS FILE MUST NOT BLOCK, and why it's easy to get wrong here.
# Django's admin mounts a *catch-all* (`catch_all_view`) that resolves anything
# under /admin/, and DRF's api-root does something similar under /api/. So
# "does it resolve?" is NOT a safety oracle for this app -- /admin/function.php
# and /api/.env both resolve today and are plainly probes. Conversely
# /graphql and /admin (no trailing slash) do NOT resolve, but APPEND_SLASH
# redirects them to the real thing, so blocking those would break real clients.
# Check urls.py, not the resolver, when adding a rule.

# ---- 1. Structural rules (safe by construction) ----------------------------

# Any dot-segment: /.env /.git/config /.aws/credentials /.htaccess /.svn/...
# Safe because no URL this app generates contains "/." -- every route in
# urls.py is a literal slug or a numeric/slug id. 9,653 observed requests.
location ~ /\. {
    return 444;
}

# Server-side script extensions at end of path. Safe because this is a Django
# app: we have never served, and will never serve, a .php/.asp/.jsp. Anchored
# to $ so a slug merely containing "php" is unaffected. 200,414 observed
# requests -- by far the biggest single win.
#
# Deliberately excludes .sh/.bat/.exe/.dll -- those are ordinary word endings a
# slug could plausibly produce, and they add almost nothing.
location ~* \.(php\d?|phtml|asp|aspx|asa|asax|jsp|cfm|cgi)$ {
    return 444;
}

# WordPress. We are not WordPress and never will be; zero of the 605 declared
# routes contain "wp-". This one prefix covers ~91 distinct observed probe
# paths (/wp-admin/..., /wp-includes/..., /wp-content/..., /wp-json/...).
# Matched as a regex rather than `location ^~ /wp-` so that it also catches the
# doubled-slash form scanners use (//wp-includes/...).
location ~* ^/+wp[-_] {
    return 444;
}

# ---- 2. Literal observed probe paths ---------------------------------------
#
# Exact matches only. Each was probed by real scanners in the last 30 days of
# ALB logs and matches no route in urls.py. Sorted alphabetically; add new ones
# in place, keep them exact.
location = /cgi-bin/ { return 444; }
location = /config.js { return 444; }
location = /config.json { return 444; }
location = /containers/json { return 444; }
location = /developmentserver/metadatauploader { return 444; }
location = /hello.world { return 444; }
location = /phpMyAdmin/ { return 444; }
location = /phpinfo { return 444; }
location = /phpmyadmin/ { return 444; }
location = /pma/ { return 444; }
location = /vendor/ { return 444; }
location = /wordpress/ { return 444; }
